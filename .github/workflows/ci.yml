name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/math-atelier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install -r requirements-dev.txt
      - name: test
        run: python -m unittest discover -s tests -p "test_*.py"

  plugin:
    name: plugin syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check host half
        run: node --check plugin/math-atelier/index.js
      - name: check client half
        run: node --check plugin/math-atelier/client.js
      - name: check manifest
        run: node -e "JSON.parse(require('fs').readFileSync('plugin/math-atelier/package.json','utf8'))"
