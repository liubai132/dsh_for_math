<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>站点自检 · 数学工坊</title>
<style>
  body { font: 13px/1.7 ui-monospace, Consolas, monospace; padding: 22px; background: #f7f5ef; color: #1b1d21; }
  iframe { width: 1180px; height: 620px; border: 1px solid #ddd; margin-top: 10px; }
  pre { white-space: pre-wrap; word-break: break-all; background: #fff; padding: 14px; border: 1px solid #e4dfd3; }
  .ok { color: #0f6b5f; }
  .bad { color: #b42318; }
</style>
</head>
<body>
<h1>站点自检</h1>
<pre id="out">running…</pre>
<iframe id="f-engine" src="/engine.html"></iframe>
<iframe id="f-numbers" src="/numbers.html?n=496"></iframe>
<iframe id="f-article" src="/article.html?slug=golden"></iframe>

<script>
(function () {
  const results = [];
  const errors = [];

  function record(name, ok, detail) {
    results.push({ name: name, ok: !!ok, detail: detail });
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function waitFor(fn, timeout) {
    const limit = Date.now() + (timeout || 15000);
    while (Date.now() < limit) {
      try { if (fn()) return true; } catch (err) { /* 继续等 */ }
      await sleep(120);
    }
    return false;
  }

  function frameWindow(id) {
    const frame = document.getElementById(id);
    return frame && frame.contentWindow;
  }

  async function checkApi() {
    try {
      const health = await (await fetch('/api/health')).json();
      record('API health', health.ok === true, health.version);
      const res = await fetch('/api/cas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'integrate', expr: 'x^2', lower: '0', upper: '1' }),
      });
      const data = await res.json();
      record('API 定积分', res.ok && /frac\{1\}\{3\}/.test(data.result_latex), data.result_latex);

      const scan = await (await fetch('/api/scan?start=1&end=2000')).json();
      record('API 区间扫描', scan.prime && scan.prime.count === 303,
        '素数 ' + (scan.prime ? scan.prime.count : '?') + '，最大间隙 ' +
        (scan.prime && scan.prime.max_gap ? scan.prime.max_gap.gap : '?'));
    } catch (err) {
      record('API health', false, String(err));
    }
  }

  async function checkEngine() {
    const win = frameWindow('f-engine');
    if (!win || !win.M) { record('引擎页加载', false, '脚本未执行'); return; }
    win.addEventListener('error', function (e) {
      errors.push('engine: ' + (e.message || e.type));
    });
    const doc = win.document;
    await waitFor(function () { return doc.querySelector('#run'); });
    doc.querySelector('#run').click();
    const ok = await waitFor(function () {
      return /完成/.test(doc.querySelector('#status').textContent);
    }, 20000);
    const latex = doc.querySelector('#result-latex');
    record('引擎计算', ok, latex ? latex.textContent.slice(0, 60) : '');
    record('引擎 KaTeX 渲染', !!(latex && latex.querySelector('.katex')), '');
  }

  async function checkNumbers() {
    const win = frameWindow('f-numbers');
    if (!win || !win.M) { record('实验室页加载', false, '脚本未执行'); return; }
    win.addEventListener('error', function (e) {
      errors.push('numbers: ' + (e.message || e.type));
    });
    const doc = win.document;
    const ok = await waitFor(function () {
      const status = doc.querySelector('#lab-status');
      return status && /完成/.test(status.textContent);
    }, 20000);
    record('实验室分析 496', ok, doc.querySelector('#big-number') ? doc.querySelector('#big-number').textContent : '');
    const facts = doc.querySelectorAll('#facts .fact').length;
    record('实验室性质卡片', facts >= 4, facts + ' 条');
    const canvas = doc.querySelector('#collatz-chart');
    record('科拉茨绘图', !!(canvas && canvas.width > 10), canvas ? canvas.width + 'px' : '无');

    doc.querySelector('#scan-run').click();
    const scanned = await waitFor(function () {
      const box = doc.querySelector('#scan-result');
      return box && box.style.display !== 'none';
    }, 20000);
    record('区间扫描界面', scanned,
      doc.querySelector('#scan-stats') ? doc.querySelector('#scan-stats').textContent.slice(0, 40) : '');
  }

  async function checkArticle() {
    const win = frameWindow('f-article');
    if (!win || !win.M) { record('文章页加载', false, '脚本未执行'); return; }
    win.addEventListener('error', function (e) {
      errors.push('article: ' + (e.message || e.type));
    });
    const doc = win.document;
    const ok = await waitFor(function () {
      const title = doc.querySelector('#article-title');
      return title && /黄金比例/.test(title.textContent);
    }, 20000);
    record('文章渲染', ok, doc.querySelector('#article-title').textContent);
    const count = await waitFor(function () {
      return doc.querySelectorAll('#article-body .katex').length >= 4;
    }, 15000);
    record('文章公式渲染', count, doc.querySelectorAll('#article-body .katex').length + ' 个 katex');
  }

  async function main() {
    await checkApi();
    await checkEngine();
    await checkNumbers();
    await checkArticle();

    const passed = results.filter(function (r) { return r.ok; }).length;
    const payload = {
      passed: passed,
      total: results.length,
      errors: errors,
      results: results,
    };
    document.getElementById('out').textContent = 'SELFTEST ' + JSON.stringify(payload);
    document.getElementById('out').className = passed === results.length ? 'ok' : 'bad';
    document.title = 'SELFTEST ' + passed + '/' + results.length;
    document.body.setAttribute('data-selftest', passed === results.length ? 'pass' : 'fail');
  }

  window.addEventListener('load', function () {
    setTimeout(main, 600);
  });
})();
</script>
</body>
</html>
