<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科普文章 · 数学工坊</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="onKatexLoaded()"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="/"><span class="mark">∑</span>数学工坊</a>
    <nav class="nav">
      <a href="/">首页</a>
      <a href="/engine.html">数学引擎</a>
      <a href="/research.html">研究台</a>
      <a href="/numbers.html">数字剖析</a>
      <a href="/article.html?slug=primes" class="active">文章</a>
    </nav>
  </div>
</header>

<main class="container">
  <article class="article">
    <h1 id="article-title">加载中…</h1>
    <div class="meta" id="article-meta"></div>
    <div id="article-body"></div>
    <p class="fallback-note">⚠️ 公式渲染库没加载成功，公式会以纯文本显示。</p>
    <hr style="border:none;border-top:1px solid var(--line);margin:36px 0 20px">
    <div class="row" id="article-nav"></div>
  </article>
</main>

<footer class="site-footer">
  <div class="inner">
    <span>数学工坊 · 本地运行</span>
    <span><a href="/">返回首页</a></span>
  </div>
</footer>

<script src="/js/common.js"></script>
<script src="/js/articles.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const slug = new URLSearchParams(location.search).get('slug');
    const list = window.ARTICLES || [];
    const index = Math.max(0, list.findIndex(function (item) { return item.slug === slug; }));
    const item = list[index] || list[0];
    if (!item) return;

    document.title = item.title + ' · 数学工坊';
    M.$('#article-title').textContent = item.title;
    M.$('#article-meta').textContent = item.tag + ' · 约 ' + item.minutes + ' 分钟 · 科普';
    M.$('#article-body').innerHTML = item.body;
    M.render(document.body);

    const nav = M.$('#article-nav');
    const prev = list[index - 1];
    const next = list[index + 1];
    nav.innerHTML =
      (prev ? '<a class="btn" href="/article.html?slug=' + prev.slug + '">← ' + M.escapeHtml(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a class="btn" href="/article.html?slug=' + next.slug + '">' + M.escapeHtml(next.title) + ' →</a>' : '<span></span>');
  });
</script>
</body>
</html>
