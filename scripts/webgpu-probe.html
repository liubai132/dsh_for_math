<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body>
<script>
(async function () {
  var out = { hasGpu: !!navigator.gpu };
  try {
    if (navigator.gpu) {
      var adapter = await navigator.gpu.requestAdapter();
      out.adapter = !!adapter;
      if (adapter) {
        out.info = adapter.info
          ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture, device: adapter.info.device }
          : 'no-info';
        var device = await adapter.requestDevice();
        out.device = !!device;
      }
    }
  } catch (e) {
    out.error = String(e);
  }
  document.title = 'WEBGPU ' + JSON.stringify(out);
})();
</script>
</body></html>
