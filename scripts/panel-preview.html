<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件面板预览 · 数学工坊</title>
<style>
  html, body { margin:0; height:100%; background:#1b1d21; font-family:system-ui,"Microsoft YaHei",sans-serif; }
  #root { height:100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  // 用假的 host / 假的主题变量，把插件面板组件单独渲染出来做视觉检查
  document.documentElement.style.setProperty('--dsw-alias-bg-base', '#ffffff');
  document.documentElement.style.setProperty('--dsw-alias-bg-layer-1', '#fbfaf7');
  document.documentElement.style.setProperty('--dsw-alias-bg-layer-2', '#f1efe9');
  document.documentElement.style.setProperty('--dsw-alias-border-l1', '#e5e1d6');
  document.documentElement.style.setProperty('--dsw-alias-border-l2', '#d3cec0');
  document.documentElement.style.setProperty('--dsw-alias-brand-primary', '#0f6b5f');
  document.documentElement.style.setProperty('--dsw-alias-label-primary', '#1b1d21');
  document.documentElement.style.setProperty('--dsw-alias-label-secondary', '#6a6f78');
  document.documentElement.style.setProperty('--dsw-alias-state-success-primary', '#1a7f5a');
  document.documentElement.style.setProperty('--dsw-alias-state-error-primary', '#b42318');
  document.documentElement.style.setProperty('--dsw-alias-state-warn-primary', '#b45309');
  document.documentElement.style.setProperty('--dsw-alias-state-idle-primary', '#9aa0a6');

    window.__err = '';
  window.__rej = '';
  window.addEventListener('error', function (e) { window.__err = e.message || 'error'; });
  window.addEventListener('unhandledrejection', function (e) { window.__rej = String(e.reason && e.reason.message || e.reason); });
  const RESPONSES = {
    '/plugin/math-atelier/api/interp/curve': {
      ok: true,
      kind: 'arc',
      path_length: 7.36,
      chord_length: 5.0,
      length_ratio: 1.47,
      frames: (function () {
        var out = [];
        var cx = 2.158
        var cy = 1.289
        var R = 2.514
        var a0 = -2.6
        var da = -2.938
        for (var i = 0; i < 60; i++) {
          var raw = i / 59;
          var t = 1 - Math.abs(2 * raw - 1);
          var th = a0 + da * t;
          out.push({ t: t, point: [cx + R * Math.cos(th), cy + R * Math.sin(th)] });
        }
        return out;
      })(),
    },
    '/plugin/math-atelier/api/library': {
      ok: true,
      total: 3,
      modules: [
        {
          id: 'interp',
          title: '插值与凸组合',
          blurb: '向量之间的线性插值、凸组合、轨迹生成',
          count: 2,
          functions: [
            {
              id: 'interp.trajectory',
              module: 'interp',
              name: 'trajectory',
              signature: 'trajectory(a, b, frames=80, mode="roundtrip")',
              summary: '生成一条动画轨迹。',
              doc: '生成一条动画轨迹。\n\nmode = "oneway"    从 a 走到 b；\nmode = "roundtrip" 从 a 走到 b 再返回。',
            },
            {
              id: 'interp.convex_combination',
              module: 'interp',
              name: 'convex_combination',
              signature: 'convex_combination(x, y, lam)',
              summary: 'λx + (1 − λ)y，逐分量计算。',
              doc: 'λx + (1 − λ)y，逐分量计算。',
            },
          ],
        },
      ],
    },
    '/plugin/math-atelier/api/interp': {
      ok: true,
      frames: (function () {
        var out = [];
        for (var i = 0; i < 40; i++) {
          var raw = i / 39;
          var t = 1 - Math.abs(2 * raw - 1);
          out.push({ t: t, point: [4 * t, 3 * t] });
        }
        return out;
      })(),
    },
    '/plugin/math-atelier/status': { ok: true, backend: 'running', port: 8899, owned: false, error: '' },
    '/plugin/math-atelier/api/conjectures': {
      conjectures: [
        { key: 'goldbach', title: '哥德巴赫猜想', statement: '每个大于 2 的偶数都能写成两个素数之和。', default_limit: 2000, limit_hint: '检验到多大的偶数' },
      ],
    },
    '/plugin/math-atelier/api/cas': {
      ok: true,
      operation: 'simplify',
      result_latex: '2 x + 1',
      result_text: '2*x + 1',
      notes: ['表达式规模：9 个运算节点 → 3 个。'],
      steps: [],
      elapsed_ms: 14,
    },
    '/plugin/math-atelier/api/number/1729': {
      n: 1729,
      factorization: [{ prime: 7, exp: 1 }, { prime: 13, exp: 1 }, { prime: 19, exp: 1 }],
      factorization_latex: '7 \\cdot 13 \\cdot 19',
      divisor_total: 8,
      divisor_sum: 2240,
      phi: 1296,
      mu: -1,
      omega: 3,
      big_omega: 3,
      collatz: { steps: 104 },
      bases: { hex: '0x6c1', roman: 'MDCCXXIX' },
      facts: [{ title: '亏数', detail: '真约数之和 511 小于它本身 1,729。' }],
    },
  };

  // 衣服轮廓的 mock：等弧长重采样
  ;(function () {
    var shirt = [[0.3, 0.12], [0.7, 0.12], [0.78, 0.2], [0.96, 0.36], [0.84, 0.46], [0.72, 0.38], [0.7, 0.9], [0.3, 0.9], [0.28, 0.38], [0.16, 0.46], [0.04, 0.36], [0.22, 0.2]];
    var dress = [[0.36, 0.1], [0.64, 0.1], [0.68, 0.22], [0.7, 0.4], [0.92, 0.94], [0.08, 0.94], [0.3, 0.4], [0.32, 0.22]];
    function resample(points, count) {
      var ring = points.concat([points[0]]);
      var cum = [0];
      for (var i = 1; i < ring.length; i++) {
        var dx = ring[i][0] - ring[i - 1][0];
        var dy = ring[i][1] - ring[i - 1][1];
        cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      var total = cum[cum.length - 1];
      var out = [];
      var cursor = 0;
      for (var k = 0; k < count; k++) {
        var target = total * k / count;
        while (cursor < cum.length - 2 && cum[cursor + 1] < target) cursor++;
        var span = cum[cursor + 1] - cum[cursor];
        var r = span <= 1e-12 ? 0 : (target - cum[cursor]) / span;
        out.push([
          ring[cursor][0] + (ring[cursor + 1][0] - ring[cursor][0]) * r,
          ring[cursor][1] + (ring[cursor + 1][1] - ring[cursor][1]) * r,
        ]);
      }
      var top = 0;
      for (var j = 1; j < out.length; j++) if (out[j][1] < out[top][1]) top = j;
      return out.slice(top).concat(out.slice(0, top));
    }
    RESPONSES['/plugin/math-atelier/api/morph/prepare'] = {
      ok: true,
      uniform: true,
      count: 160,
      a: resample(shirt, 160),
      b: resample(dress, 160),
      perimeter_a: 3.117313,
      perimeter_b: 2.887036,
    };
  })();

  // 相图 mock：阻尼振子
  ;(function () {
    var arrows = [];
    var grid = 13;
    for (var i = 0; i < grid; i++) {
      for (var j = 0; j < grid; j++) {
        var x = -2 + (4 * i) / (grid - 1);
        var y = -2 + (4 * j) / (grid - 1);
        arrows.push({ x: x, y: y, dx: y, dy: -x - 0.3 * y });
      }
    }
    var curves = [];
    var seeds = [[1.6, 0.4], [1.6, -0.6], [-1.5, 0.8], [-1.5, -0.9], [0.2, 1.7], [-0.3, -1.7]];
    for (var s = 0; s < seeds.length; s++) {
      var px = seeds[s][0];
      var py = seeds[s][1];
      var pts = [];
      for (var k = 0; k < 600; k++) {
        pts.push([px, py]);
        var dx = py;
        var dy = -px - 0.3 * py;
        px += 0.017 * dx;
        py += 0.017 * dy;
      }
      curves.push(pts);
    }
    RESPONSES['/plugin/math-atelier/api/phase/portrait'] = {
      ok: true,
      system: 'oscillator',
      name: '阻尼振子',
      formula: "x' = y,   y' = −x − 0.3y",
      bounds: { xmin: -2, xmax: 2, ymin: -2, ymax: 2 },
      arrows: arrows,
      curves: curves,
      equilibria: [{ x: 0, y: 0, kind: '焦点', stable: true, trace: -0.3, det: 1 }],
    };
  })();

  window.fetch = async function (url, options) {    window.__fetchCount = (window.__fetchCount||0)+1; const key = String(url).split('?')[0];
    const data = RESPONSES[key];
    // 不用 Response：headless 的虚拟时间下流式 body 可能挂起，直接给一个最小实现
    return {
      ok: Boolean(data),
      status: data ? 200 : 404,
      json: async function () { return data ?? { detail: 'mock 404' }; },
      text: async function () { return JSON.stringify(data ?? {}); },
    };
  };

  let plugin = null;
  window.__ModuleLoader__ = {
    load(definition) {
      plugin = definition.factory((name) => (name === 'react' ? window.React : undefined));
    },
  };
</script>
<script src="../plugin/math-atelier/client.js"></script>
<script>
  setTimeout(function () {
    fetch('/plugin/math-atelier/api/cas', { method: 'POST', body: '{}' })
      .then(function (r) { return r.json(); })
      .then(function (d) { window.__probe = 'json:' + d.result_text; })
      .catch(function (e) { window.__probe = 'fail:' + e.message; });
  }, 1500);
  const registrations = [];
  const fakeCtx = {
    slots: {
      inject(key, callback) { callback(); },
      register(options, component) { registrations.push({ options, component }); },
    },
  };
  plugin.apply(fakeCtx);

  const entry = registrations.find((item) => item.options.key === 'math-atelier');
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(entry.component));

  // 模拟"切走面板再切回来"：卸载后重新挂载（模块级状态应当保留）
  window.__remount = function () {
    root.unmount();
    const next = ReactDOM.createRoot(document.getElementById('root'));
    next.render(React.createElement(entry.component));
  };

  // 自动填一个表达式并点「计算」，好让截图里带上结果
  setTimeout(function () {
    const textarea = document.querySelector('textarea');
    if (!textarea) return;
    const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
    setter.call(textarea, '(x+1)^2 - x^2');
    textarea.dispatchEvent(new Event('input', { bubbles: true }));
    setTimeout(function () {
      const button = Array.from(document.querySelectorAll('button')).find((b) => b.textContent === '计算');
      if (button) button.click();
      setTimeout(function () {
        document.title =
          'cards=' + document.querySelectorAll('.ma-card').length +
          ' math=' + document.querySelectorAll('.ma-math').length +
          ' err=' + document.querySelectorAll('.ma-error').length + ' fetch=' + (window.__fetchCount||0) + ' btn=' + !!document.querySelector('.ma-btn-primary') + ' e=' + window.__err + ' r=' + window.__rej + ' probe=' + window.__probe;
      }, 800);
    }, 120);
  }, 400);
</script>
</body>
</html>
